<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CarbonIQ -- geospatial project and site analytics for carbon and biodiversity monitoring."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Fonts are self-hosted via @fontsource and imported in main.jsx
         (DESIGN.md §3.2: do not load from a CDN at runtime). -->

    <title>CarbonIQ — Geospatial project and site analytics</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- Applies the saved theme before first paint. Without this, a visitor who
         chose dark would see a white flash while React boots. Deliberately
         inline and synchronous: an external script would be too late. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('carboniq.theme');
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.setAttribute('data-theme', saved);
          }
        } catch (error) {
          // Storage blocked (private mode). Fall back to prefers-color-scheme.
        }
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
